[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lfp-model"
version = "0.5.0"
description = "LiFePO4 porous-electrode model with crystal-scale transport, solved with bandsolver"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dependencies = ["numpy", "bandsolver>=0.1.2"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyterlab"]
test = ["pytest", "scipy"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests", "private_checks"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
# I is the current; compact statements mirror the Fortran; short lambdas name local formulas
ignore = ["E741", "E702", "E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_notebooks.py" = ["E501"]   # notebook text
