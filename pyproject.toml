[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lfp-model"
version = "0.1.0"
description = "LiFePO4 porous-electrode model with crystal-scale transport, solved with bandsolver"
license = "BSD-3-Clause"
requires-python = ">=3.9"
dependencies = ["numpy", "bandsolver>=0.1.1"]

[project.optional-dependencies]
notebooks = ["matplotlib", "jupyterlab"]
test = ["pytest", "scipy"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests", "private_checks"]
pythonpath = ["."]
